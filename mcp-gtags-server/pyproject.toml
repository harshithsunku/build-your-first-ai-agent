[project]
name = "mcp-gtags-server"
version = "0.2.0"
description = "MCP server exposing GNU Global (gtags) code navigation for C/C++ codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshith Sunku" }]
keywords = ["mcp", "gtags", "gnu-global", "c", "c++", "code-navigation"]
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gtags-mcp = "gtags_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtags_mcp"]
